# Nome do workflow, aparece no "Actions"
name: Pipeline CI/CD

# Definir quando o pipeline será disparado
on:
  push:
    branches:
      - main
      
  paths: # So dispara se arquivos nessas pastas mudarem
    - "src/**" # So mudança no codigo fonte
    - ".github/workflows/**" # Mudança no proprio pipeline

  workflow_dispatch: # habilitar o botão "Run workflow" no GitHub Actions


jobs:
  # Primeiro job: build
  build:
    runs-on: ubuntu-latest # Imagem da máquina usada no CI

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm install

      - name: Rodar o build
        run: npm run build

  tests:
    runs-on: ubunto-latest
    needs: build

          steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalação do Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm install

      - name: Verificar Formatação
        run: npm run format -- -- check

      - name: Rodar testes
        run: npm run test

    
